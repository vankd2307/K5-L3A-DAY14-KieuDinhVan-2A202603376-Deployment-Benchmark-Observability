# Exercise 7.3 — Quality gate: chạy eval trên golden dataset ở mỗi pull request.
# run_eval.py trả exit code 1 khi accuracy < --min-accuracy hoặc có regression
# → job fail → PR không merge được (bật branch protection "Require status checks").
name: quality-gate
on: [pull_request]

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Start agent v2
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8000 python app.py &
          sleep 3
      - name: Eval + quality gate
        run: python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 --baseline reports/eval_v2.json
