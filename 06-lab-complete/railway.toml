# Cấu hình deploy Railway (tiêu chí 12)
# Deploy:  cd 06-lab-complete && railway up
# Biến môi trường (AGENT_API_KEY, REDIS_URL...) đặt trong Railway Variables, không ghi ở đây.
# PORT do Railway cấp; CMD trong Dockerfile đọc ${PORT:-8000}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
