# Cấu hình deploy Render (Blueprint) — có thể dùng thay railway.toml (tiêu chí 12)
# Render Dashboard → New → Blueprint → chọn repo, đường dẫn file: 06-lab-complete/render.yaml
# AGENT_API_KEY dùng sync: false → Render hỏi giá trị lúc tạo, không ghi thẳng vào file.

services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: LOG_LEVEL
        value: INFO
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []   # chỉ nhận kết nối nội bộ từ service trên Render
